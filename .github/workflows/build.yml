# KampüsAI — her gönderimde (push) üç sürümü derler:
#   • iPhone / web  → GitHub Pages (https://<kullanıcı>.github.io/<repo>/)
#   • Android       → KampusAI-<sürüm>.apk
#   • Windows       → KampusAI-Kurulum-<sürüm>.exe
# APK ve EXE, "Releases" sayfasında yeni bir sürüm olarak yayınlanır.
name: Derle ve yayınla

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  # Yapay zeka sunucusu (Cloudflare Worker). Repo ayarlarında şu gizli değerler varsa yayınlanır:
  #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY
  # Yoksa atlanır; uygulamalar o zaman kullanıcının kendi anahtarıyla çalışır.
  server:
    name: Yapay zeka sunucusu
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deploy
        name: Cloudflare'e yayınla
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::Sunucu gizli değerleri tanımlı değil; sunucu yayınlanmadı."
            echo "url=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          echo "Sunucu: $URL"
          test -n "$URL"
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/health" && break; sleep 5; done
          # Gerçek Gemini ile kısa deneme (sohbet + vektör)
          echo "::notice::Gemini denemesi: $(curl -sS "$URL/selftest" | head -c 900)"
          EMB=$(curl -sS -X POST "$URL/v1beta/models/gemini-embedding-001:batchEmbedContents" -H 'content-type: application/json' \
            -d '{"requests":[{"model":"models/gemini-embedding-001","content":{"parts":[{"text":"deneme"}]},"outputDimensionality":768}]}' | head -c 200)
          echo "::notice::Vektör: $(echo "$EMB" | tr -d '\n ' | head -c 80)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  web:
    name: Web / iPhone
    needs: server
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DA_SERVER_URL: ${{ needs.server.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web dosyalarını hazırla
        run: |
          node tools/build-web.mjs dist/web --version "$APP_VERSION"
          touch dist/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  pages:
    name: GitHub Pages'e yayınla
    needs: web
    runs-on: ubuntu-latest
    # Pages henüz açılmadıysa diğer sürümler yine yayınlansın
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android (APK)
    needs: server
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DA_SERVER_URL: ${{ needs.server.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web dosyalarını hazırla
        run: node tools/build-web.mjs mobile/www --version "$APP_VERSION"
      - name: Capacitor projesini oluştur
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
      - name: Uygulama ikonu ve açılış ekranı
        working-directory: mobile
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor "#15161b" --iconBackgroundColorDark "#15161b"
          --splashBackgroundColor "#121318" --splashBackgroundColorDark "#121318"
      - name: Eşitle
        working-directory: mobile
        run: npx cap sync android
      - name: Sürüm numarası, kamera izni, imza anahtarı
        working-directory: mobile/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" app/build.gradle
          grep -q "android.permission.CAMERA" app/src/main/AndroidManifest.xml || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' app/src/main/AndroidManifest.xml
          # Her derlemede aynı imza: yeni sürüm eskisinin üzerine kurulur, veriler silinmez
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          grep -E "versionCode|versionName" app/build.gradle
      - name: APK derle
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Dosyayı adlandır
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "KampusAI-$APP_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: KampusAI-*.apk
          if-no-files-found: error

  android-test:
    name: Android açılış testi
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p shots
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android-smoke.sh
      - name: Test sonuçlarını kaydet
        if: always()
        working-directory: shots
        run: |
          git init -q && git checkout -q -b ci-sonuc-android && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run $GITHUB_RUN_NUMBER" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-sonuc-android

  windows:
    name: Windows (kurulum)
    needs: server
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DA_SERVER_URL: ${{ needs.server.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web dosyalarını hazırla
        run: node tools/build-web.mjs desktop/app --version "$APP_VERSION"
      - name: Kurulum dosyasını derle
        working-directory: desktop
        run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
      - name: Uygulamayı dene (açılış testi)
        working-directory: desktop
        run: |
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar | grep -E "^[\\/]app[\\/]index.html$"
          mkdir -p smoke
          DA_SMOKE_OUT="$PWD/smoke/windows.json" timeout 120 ./dist/win-unpacked/KampusAI.exe || true
          cat smoke/windows.json
          node -e "process.exit(require('./smoke/windows.json').ok ? 0 : 1)"
      - name: Test sonuçlarını kaydet
        if: always()
        working-directory: desktop/smoke
        run: |
          git init -q && git checkout -q -b ci-sonuc-windows && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run $GITHUB_RUN_NUMBER" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-sonuc-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Sürümü yayınla
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{android,windows}"
          merge-multiple: true
      - name: Sürüm notu
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          cat > notes.md <<NOTES
          ## KampüsAI $APP_VERSION

          **Windows:** \`KampusAI-Kurulum-$APP_VERSION.exe\` dosyasını indirip çalıştır. Windows "bilgisayarınızı korudu" derse **Ek bilgi → Yine de çalıştır**.

          **Android:** \`KampusAI-$APP_VERSION.apk\` dosyasını telefondan indirip aç. İlk seferde "bilinmeyen kaynaklardan yükleme" izni istenir. Yeni sürüm eskisinin üzerine kurulur, verilerin silinmez.

          **iPhone:** Safari'de https://$OWNER.github.io/$REPO/ adresini aç → Paylaş → **Ana Ekrana Ekle**.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: KampüsAI ${{ env.APP_VERSION }}
          body_path: notes.md
          make_latest: true
          files: |
            out/*.apk
            out/*.exe

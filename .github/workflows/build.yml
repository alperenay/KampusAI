# KampüsAI — her gönderimde (push) üç sürümü derler:
#   • iPhone / web  → GitHub Pages (https://<kullanıcı>.github.io/<repo>/)
#   • Android       → KampusAI-<sürüm>.apk
#   • Windows       → KampusAI-Kurulum-<sürüm>.exe
#   • Pardus/Linux  → KampusAI-<sürüm>-pardus-amd64.deb + KampusAI-<sürüm>-x86_64.AppImage
# APK, EXE, DEB ve AppImage "Releases" sayfasında yeni bir sürüm olarak yayınlanır.
name: Derle ve yayınla

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Yayınlanan sürüm numarası: yeni sürüm çıkarırken burayı değiştir.
  # (Android'in iç sürüm kodu her derlemede otomatik artar; yeni APK eskisinin üzerine kurulur.)
  APP_VERSION: 1.43.0
  # Telefona gömülen yapay zeka motoru (llama.cpp) sürümü — tools/llama-android.sh
  LLAMA_CPP_TAG: b11707

jobs:
  # Yapay zeka sunucusu (Cloudflare Worker). Repo ayarlarında şu gizli değerler varsa yayınlanır:
  #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY
  # Yoksa atlanır; uygulamalar o zaman kullanıcının kendi anahtarıyla çalışır.
  server:
    name: Yapay zeka sunucusu
    if: ${{ github.ref == 'refs/heads/main' }}   # başka dallarda yalnızca deneme derlemesi: yayın yok
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deploy
        name: Cloudflare'e yayınla
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::Sunucu gizli değerleri tanımlı değil; sunucu yayınlanmadı."
            echo "url=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          echo "Sunucu: $URL"
          test -n "$URL"
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/health" && break; sleep 5; done
          # Gerçek Gemini ile kısa deneme (sohbet + vektör)
          echo "::notice::Gemini denemesi: $(curl -sS "$URL/selftest" | head -c 900)"
          EMB=$(curl -sS -X POST "$URL/v1beta/models/gemini-embedding-001:batchEmbedContents" -H 'content-type: application/json' \
            -d '{"requests":[{"model":"models/gemini-embedding-001","content":{"parts":[{"text":"deneme"}]},"outputDimensionality":768}]}' | head -c 200)
          echo "::notice::Vektör: $(echo "$EMB" | tr -d '\n ' | head -c 80)"
          # Eşitleme odası denemesi (rastgele kod: yaz, sonra başka "cihaz" gibi oku)
          SC=$(tr -dc 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789' < /dev/urandom | head -c 12)
          curl -sS -X POST "$URL/sync/$SC" -H 'content-type: application/json' -d '{"cursor":0,"changes":[{"s":"notes","id":"ci","u":1,"d":{"id":"ci","t":"ok"}}]}' > /dev/null
          echo "::notice::Eşitleme: $(curl -sS -X POST "$URL/sync/$SC" -H 'content-type: application/json' -d '{"cursor":0,"changes":[]}' | head -c 300)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  ui-checks:
    name: Öğretmen ve tüm ekran regresyonu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test tarayıcısını hazırla
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Arayüz ve çevrimdışı veri akışları
        run: |
          npm run test:study-ui
          npm run test:research-ui
          npm run test:teacher-review-ui
          npm run test:generation-ui
          node tools/removed-model-ui-check.mjs
          npm run test:all-features-ui
          npm run test:v142-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression-results
          path: dist/qa
          if-no-files-found: ignore

  web:
    name: Web / iPhone
    needs: [server, ui-checks]
    if: ${{ !cancelled() && needs['ui-checks'].result == 'success' }}
    runs-on: ubuntu-latest
    env:
      DA_SERVER_URL: ${{ needs.server.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: AR çekirdeği sınaması
        run: node tools/ar-check.mjs
      - name: JavaScript sözdizimi ve kaynak referansları
        run: node tools/syntax-check.mjs
      - name: Uyarlanan test ve günlük öneri motoru
        run: node tools/study-check.mjs
      - name: Gerekçe/eminlik, ipucu ve çevrimdışı araştırma QR akışı
        run: node tools/research-check.mjs
      - name: Öğretmen gerekçe ve kademeli üretim kontrolleri
        run: node tools/teacher-review-check.mjs
      - name: Çevrendeki Fizik sınaması
        run: node tools/cevre-check.mjs
      - name: Konuşan Kavramlar sınaması
        run: node tools/kavram-check.mjs
      - name: Kazanım içeriği denetimi (alanlar, kimlikler, KaTeX)
        run: node tools/content-check.mjs
      - name: İçerik dizini güncel mi (isteğe bağlı ders yükleme)
        run: node tools/build-content-index.mjs --check
      - name: Tekrar kuyruğu, QR Sınıf Modu ve karne sınaması
        run: node tools/v142-check.mjs
      - name: Eski cihaz uyumu (iOS 16.3 düzenli ifade sözdizimi)
        run: node tools/compat-check.mjs
      - name: Web dosyalarını hazırla
        run: |
          node tools/build-web.mjs dist/web --version "$APP_VERSION"
          touch dist/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  pages:
    name: GitHub Pages'e yayınla
    needs: web
    if: ${{ github.ref == 'refs/heads/main' }}   # başka dallarda yalnızca deneme derlemesi: yayın yok
    runs-on: ubuntu-latest
    # Pages henüz açılmadıysa diğer sürümler yine yayınlansın
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Telefonda internetsiz yapay zeka için llama-server (arm64 + emülatör için x86_64); sürüm başına bir kez derlenir
  llama-android:
    name: Android yapay zeka motoru
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: llama-android
          key: llama-android-${{ env.LLAMA_CPP_TAG }}-${{ hashFiles('tools/llama-android.sh') }}
      - name: Derle
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q ninja-build >/dev/null
          bash tools/llama-android.sh "$PWD/llama-android" "$LLAMA_CPP_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: llama-android
          path: llama-android
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: [server, llama-android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DA_SERVER_URL: ${{ needs.server.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web dosyalarını hazırla
        run: node tools/build-web.mjs mobile/www --version "$APP_VERSION"
      - name: Capacitor projesini oluştur
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
      - name: Uygulama ikonu ve açılış ekranı
        working-directory: mobile
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor "#15161b" --iconBackgroundColorDark "#15161b"
          --splashBackgroundColor "#121318" --splashBackgroundColorDark "#121318"
      - name: Eşitle
        working-directory: mobile
        run: npx cap sync android
      - name: Sürüm numarası, kamera izni, imza anahtarı
        working-directory: mobile/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" app/build.gradle
          grep -q "android.permission.CAMERA" app/src/main/AndroidManifest.xml || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' app/src/main/AndroidManifest.xml
          # Ders hatırlatıcıları saatinde gelsin (tam zamanlı alarm)
          grep -q "USE_EXACT_ALARM" app/src/main/AndroidManifest.xml || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' app/src/main/AndroidManifest.xml
          # Sesli Feynman (konuşma → yazı) için mikrofon; Android 11+ paket görünürlüğü: ses tanıma ve sesli okuma servisleri
          grep -q "android.permission.RECORD_AUDIO" app/src/main/AndroidManifest.xml || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' app/src/main/AndroidManifest.xml
          grep -q "android.speech.RecognitionService" app/src/main/AndroidManifest.xml || \
            sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>\n</manifest>#' app/src/main/AndroidManifest.xml
          # Klavye açılınca sayfa küçülsün (yazı kutusu klavyenin altında kalmasın)
          grep -q "windowSoftInputMode" app/src/main/AndroidManifest.xml || \
            sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:windowSoftInputMode="adjustResize"#' app/src/main/AndroidManifest.xml
          cp ../native/MainActivity.java ../native/DeviceAi.java ../native/KampusWidget.java app/src/main/java/com/dersasistani/app/
          # Ana ekran widget'ı (v1.21): düzen, sağlayıcı bilgisi ve alıcı kaydı
          mkdir -p app/src/main/res/layout app/src/main/res/xml
          cp ../native/res/layout/*.xml app/src/main/res/layout/
          cp ../native/res/xml/*.xml app/src/main/res/xml/
          grep -q "KampusWidget" app/src/main/AndroidManifest.xml || \
            sed -i 's#</application>#    <receiver android:name=".KampusWidget" android:exported="false">\n            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_kampus_info" />\n        </receiver>\n    </application>#' app/src/main/AndroidManifest.xml
          # Yapay zeka motoru kurulumda çalıştırılabilir klasöre çıkarılsın (lib*.so, sıkıştırılmadan)
          printf '\nandroid { packaging { jniLibs { useLegacyPackaging = true } } }\n' >> app/build.gradle
          mkdir -p app/src/main/res/drawable && cp ../native/res/drawable/*.xml app/src/main/res/drawable/
          grep -nE "MainActivity|permission|KampusWidget|appwidget" app/src/main/AndroidManifest.xml
          # Sürüm derlemesinde lint uyarıları derlemeyi durdurmasın
          printf '\nandroid { lint { checkReleaseBuilds = false; abortOnError = false } }\n' >> app/build.gradle
          chmod +x gradlew
          grep -E "versionCode|versionName" app/build.gradle
      - name: Yapay zeka motorunu ekle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: llama-android
          path: mobile/android/app/src/main/jniLibs
      - name: APK derle
        working-directory: mobile/android
        run: |
          rm -f app/src/main/jniLibs/SURUM
          ls -laR app/src/main/jniLibs || echo "yapay zeka motoru yok: telefonda indirme düğmesi 'desteklenmiyor' gösterir"
          ./gradlew assembleRelease --no-daemon --stacktrace
      # İmza: tools/sign-apk.sh (kalıcı yayın anahtarı GitHub gizli değerlerinde)
      - name: APK'yı imzala
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: bash tools/sign-apk.sh mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "KampusAI-$APP_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: KampusAI-*.apk
          if-no-files-found: error

  android-test:
    name: Android açılış testi
    needs: android
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p shots
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android-smoke.sh
      - name: Test sonuçlarını kaydet
        if: always()
        working-directory: shots
        run: |
          git init -q && git checkout -q -b ci-sonuc-android && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run $GITHUB_RUN_NUMBER" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-sonuc-android

  windows:
    name: Windows (kurulum)
    needs: server
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DA_SERVER_URL: ${{ needs.server.outputs.url }}
      # İsteğe bağlı kod imzalama sertifikası (.pfx, base64) — varsa kurulum dosyası imzalanır
      # (SignPath / OV sertifikası). Yoksa imzasız derlenir.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web dosyalarını hazırla
        run: node tools/build-web.mjs desktop/app --version "$APP_VERSION"
      - name: Kurulum dosyasını derle
        working-directory: desktop
        run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
      - name: Uygulamayı dene (açılış testi)
        working-directory: desktop
        run: |
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar | grep -E "^[\\/]app[\\/]index.html$"
          mkdir -p smoke
          DA_SMOKE_OUT="$PWD/smoke/windows.json" timeout 120 ./dist/win-unpacked/KampusAI.exe || true
          cat smoke/windows.json
          node -e "process.exit(require('./smoke/windows.json').ok ? 0 : 1)"
      - name: Test sonuçlarını kaydet
        if: always()
        working-directory: desktop/smoke
        run: |
          git init -q && git checkout -q -b ci-sonuc-windows && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run $GITHUB_RUN_NUMBER" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-sonuc-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      # Microsoft Store paketi: Store'dan kurulan uygulamada SmartScreen uyarısı çıkmaz.
      # Partner Center'daki kimlik bilgileri repo değişkenlerine (Settings → Variables) girilince derlenir:
      #   MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER (CN=...), MSSTORE_PUBLISHER_NAME
      - name: Microsoft Store paketi (isteğe bağlı)
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        working-directory: desktop
        env:
          CSC_LINK: ""
        run: >
          npx electron-builder --win appx --x64 --publish never
          -c.appx.identityName="${{ vars.MSSTORE_IDENTITY_NAME }}"
          -c.appx.publisher="${{ vars.MSSTORE_PUBLISHER }}"
          -c.appx.publisherDisplayName="${{ vars.MSSTORE_PUBLISHER_NAME }}"
          -c.appx.displayName="KampüsAI" -c.appx.applicationId=KampusAI
          -c.appx.artifactName="KampusAI-Store-${version}.${ext}"
      - uses: actions/upload-artifact@v4
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        with:
          name: msstore
          path: desktop/dist/*.appx
          if-no-files-found: ignore

  # Pardus / Linux masaüstü için llama-server: Debian 12'de derlenir (Pardus 23 = Debian 12, Pardus 25 = Debian 13)
  llama-linux:
    name: Linux yapay zeka motoru
    runs-on: ubuntu-latest
    container: debian:12
    continue-on-error: true
    steps:
      - name: Araçlar
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends build-essential cmake ninja-build git ca-certificates libvulkan-dev glslc binutils >/dev/null
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: llama-linux
          key: llama-linux-${{ env.LLAMA_CPP_TAG }}-${{ hashFiles('tools/llama-linux.sh') }}
      - name: Derle
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/llama-linux.sh "$PWD/llama-linux" "$LLAMA_CPP_TAG"
      - name: Paketle (çalıştırma izinleri korunsun)
        run: tar -czf llama-linux.tgz llama-linux
      - uses: actions/upload-artifact@v4
        with:
          name: llama-linux
          path: llama-linux.tgz
          if-no-files-found: error

  linux:
    name: Pardus / Linux (deb + AppImage)
    needs: [server, llama-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DA_SERVER_URL: ${{ needs.server.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: llama-linux
      - name: Yapay zeka motorunu yerleştir
        run: |
          if [ -f llama-linux.tgz ]; then tar -xzf llama-linux.tgz; else mkdir -p llama-linux; echo "UYARI: motor derlenemedi, paket motorsuz"; fi
          ls -la llama-linux
      - name: Web dosyalarını hazırla
        run: node tools/build-web.mjs desktop/app --version "$APP_VERSION"
      - name: Paketleri derle
        working-directory: desktop
        run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --linux deb AppImage --x64 --publish never
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
          if-no-files-found: error

  # Pardus'un temeli Debian 12'de: paketi apt ile kur, uygulamayı ekransız (Xvfb) aç, motoru çalıştır
  linux-test:
    name: Pardus kurulum testi
    needs: linux
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Kur
        run: |
          apt-get update -q
          apt-get install -y -q ./KampusAI-*-pardus-amd64.deb xvfb xauth git ca-certificates >/dev/null
          dpkg -s kampusai | grep -E "^(Package|Version|Depends|Recommends):"
          ls -la /opt/KampusAI/resources/llama || true
          grep -E "^(Name|Categories|Exec)=" /usr/share/applications/kampusai.desktop
      - name: Yapay zeka motoru çalışıyor mu
        run: |
          M=/opt/KampusAI/resources/llama
          LD_LIBRARY_PATH=$M $M/llama-server --version > motor.txt 2>&1; KOD=$?; cat motor.txt; exit $KOD
      - name: Uygulamayı aç (açılış testi)
        shell: bash
        run: |
          mkdir -p smoke
          DA_SMOKE_OUT="$PWD/smoke/linux.json" timeout 120 xvfb-run -a -s "-screen 0 1280x900x24" /opt/KampusAI/kampusai --no-sandbox > smoke/calisma.log 2>&1 || echo "cikis kodu $?" >> smoke/calisma.log
          cp motor.txt smoke/ 2>/dev/null || true
          ozet() { echo "::warning title=$1::$(head -c 3500 "$2" 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; }
          ozet "linux.json" smoke/linux.json
          ozet "motor" smoke/motor.txt
          tail -40 smoke/calisma.log > smoke/son.log; ozet "calisma.log" smoke/son.log
          test "$(sed -n 's/.*"ok": *\(true\|false\).*/\1/p' smoke/linux.json | head -1)" = true
      - name: Test sonuçlarını kaydet
        if: always()
        shell: bash
        run: |
          mkdir -p smoke && cd smoke
          git config --global --add safe.directory "$PWD"
          git config --global init.defaultBranch main
          git init -q && git checkout -q -b ci-sonuc-linux && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run $GITHUB_RUN_NUMBER" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-sonuc-linux

  release:
    name: Sürümü yayınla
    needs: [android, windows, linux, web, linux-test, android-test]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.android.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.web.result == 'success' && needs['linux-test'].result == 'success' && needs['android-test'].result == 'success' }}   # başka dallarda yalnızca deneme derlemesi: yayın yok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{android,windows,linux}"
          merge-multiple: true
      - name: Sürüm notu
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          cat > notes.md <<NOTES
          ## KampüsAI $APP_VERSION

          **Bu sürümde:** *Eminlik işaretleme*: hap kartlarında ve tekrar listesinde "Ne kadar eminsin?" seçimi (haftalık karnedeki üstbiliş indeksine katılır); yapay zekâ cevaplarında kaynak, hesap doğrulaması, fotoğraf okuma ve çekincelere dayanan, gerekçeli *güven göstergesi*. Deney Laboratuvarı 67'den *82 deneye* çıktı (türev, integral, diziler, üstel büyüme, parabol, olasılık, istatistik, üçgen çözme, dönüşümler, katı cisimler, mevsimler, iklim, nüfus piramidi, mitoz–mayoz, kalıtım). Müfredata eksik TYT/AYT konuları eklendi (725 → 742 kazanım): hücre bölünmeleri, üreme ve kalıtım; çember–daire ve katı cisimler; Dünya'nın hareketleri ve coğrafi konum; madde ve özkütle, adezyon–kohezyon; karışımlar ve asit–baz–tuz. Tüm yeni anlatımlar özgün olarak yazıldı.

          **Windows:** \`KampusAI-Kurulum-$APP_VERSION.exe\` dosyasını indirip çalıştır.
          Uygulama henüz yeni ve kod imzası olmadığı için Windows "**Windows kişisel bilgisayarınızı korudu**" diyebilir: **Ek bilgi → Yine de çalıştır**. Bu bir virüs uyarısı değil, "bu yayımcıyı henüz tanımıyorum" uyarısıdır. Kaynak kodun tamamı bu sayfada açık.

          **Pardus / Linux:** \`KampusAI-$APP_VERSION-pardus-amd64.deb\` dosyasını indirip çift tıkla (Pardus Paket Kurucu açılır) ya da uçbirimde: \`sudo apt install ./KampusAI-$APP_VERSION-pardus-amd64.deb\`. Uygulama menüde **Eğitim** altında "KampüsAI" olarak görünür. İnternetsiz yapay zekâ motoru paketin içinde gelir; 8 GB bellekli okul bilgisayarı ve akıllı tahtalar (ETAP) için "Hafif" model önerilir. Kurulum yapmadan denemek için: \`KampusAI-$APP_VERSION-x86_64.AppImage\` → sağ tık → Özellikler → "Çalıştırılabilir", sonra çift tık.

          **Android:** \`KampusAI-$APP_VERSION.apk\` dosyasını telefondan indirip aç. İlk seferde "bilinmeyen kaynaklardan yükleme" izni istenir. Bundan sonraki sürümler eskisinin üzerine kurulur, verilerin silinmez. (1.13.0 ve öncesinden geliyorsan bir kereliğine: Ayarlar → **Yedekle**, eski uygulamayı kaldır, yenisini kur, yedeği geri yükle.)
          Google Play Protect "**Uygulama engellendi**" ya da "Güvenli olmayabilir" derse: **Diğer ayrıntılar → Yine de yükle**. Yalnızca "Anladım" düğmesi görünüyorsa: Play Store → sağ üstte profil → **Play Protect** → ⚙ → "Uygulamaları Play Protect ile tara"yı kurulum süresince kapat, kurduktan sonra yeniden aç. Uygulama Google Play dışından dağıtıldığı için bu uyarı çıkar; uygulama yalnızca kamera, mikrofon ve bildirim izni ister.

          **İnternet tarayıcısından (kurulumsuz):** https://$OWNER.github.io/$REPO/ — Android'de Chrome menüsünden **Ana ekrana ekle** de kullanılabilir; hiçbir uyarı çıkmaz (cihazdaki yapay zekâ hariç, internet modu çalışır).

          **iPhone:** Safari'de https://$OWNER.github.io/$REPO/ adresini aç → Paylaş → **Ana Ekrana Ekle**.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: KampüsAI ${{ env.APP_VERSION }}
          body_path: notes.md
          make_latest: true
          files: |
            out/*.apk
            out/*.exe
            out/*.deb
            out/*.AppImage

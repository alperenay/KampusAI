name: Sunucu denemesi
on:
  push:
    branches: [kampusai-egitim]
    paths: ["server/**", ".github/workflows/worker-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derle (yayınlamadan)
        working-directory: server
        run: npx --yes wrangler@4 deploy --dry-run --outdir ../wr-out
